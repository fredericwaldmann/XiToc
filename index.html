<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XiToc</title>
    <link data-trunk rel="rust" data-bin="xitoc">
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #414141; }
      canvas { width: 100%; height: 100%; display: block; }
      #loading { position: absolute; top: 40%; width: 100%; text-align: center; color: white; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="xitoc-canvas" aria-label="XiToc editor"></canvas>
    <script>
      const editorCanvas = document.getElementById("xitoc-canvas");
      // Keep Select All and Duplicate inside the editor (not browser bookmarks).
      // Native page selection can make Firefox
      // drag the canvas itself and swallow the app's move/release events.
      // The text agent is a separate input element and keeps native text shortcuts.
      editorCanvas.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && !event.altKey
            && (["a", "d"].includes(event.key.toLowerCase()) && !event.shiftKey
                || event.key.toLowerCase() === "g")) {
          event.preventDefault();
        }
      });
      // This only stops drags originating on the canvas; external file drops
      // still use their own dragover/drop events through eframe.
      editorCanvas.addEventListener("dragstart", (event) => event.preventDefault());

      // Set by Rust after drawing changes. No storage, uploads or background work.
      window.addEventListener("beforeunload", (event) => {
        if (window.xitocHasUnsavedChanges) {
          event.preventDefault();
          event.returnValue = "";
        }
      });
    </script>
    <div id="loading" role="status">Loading XiToc…</div>
  </body>
</html>
