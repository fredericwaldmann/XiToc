[package]
name = "xitoc"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
pdf-writer = "0.15"
lopdf = { version = "0.45", default-features = false, features = ["wasm_js"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "file-handle-inner"] }

egui = { version = "=0.37.0", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
latex-rust = "=3.0.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.11"
base64 = "0.22"
resvg = { version = "=0.50.0", default-features = false }
unicode-segmentation = "1.13.3"
i_overlay = "9.2.0"
earcutr = "0.5.0"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window", "ClipboardEvent", "DataTransfer", "FileList", "File", "DragEvent", "DomRect", "EventTarget"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std = "3"
fontdb = "0.24.0"
tempfile = "3"
