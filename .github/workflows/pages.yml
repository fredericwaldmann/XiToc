name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Rust and WebAssembly target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Install Trunk
        run: cargo install trunk --version 0.22.0 --locked
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check WebAssembly target
        run: cargo check --locked --target wasm32-unknown-unknown
      - name: Build XiToc for GitHub Pages
        run: trunk build --release --public-url /XiToc/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
